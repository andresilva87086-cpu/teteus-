<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merenda Escolar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8f0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #238b45;
            color: white;
            padding: 25px;
            border-radius: 12px;
        }

        .card {
            background-color: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #cccccc;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        .sim {
            background-color: #238b45;
        }

        .nao {
            background-color: #d93636;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍎 Merenda Escolar</h1>
        <p>Alimentação saudável para todos!</p>
    </header>

    <div class="card">
        <h2>🍽️ Merenda de Hoje</h2>

        <p>Confira nossa merenda do dia!</p>

        <h3>Você vai merendar hoje?</h3>

        <button class="sim">SIM</button>
        <button class="nao">NÃO</button>
    </div>

</body>
</html>
